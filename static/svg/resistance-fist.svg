<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <defs>
    <linearGradient id="fistGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0080;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Forearm/Wrist -->
  <path d="M70 300 L70 220 Q70 200 80 190 L120 190 Q130 200 130 220 L130 300" 
        stroke="url(#fistGlow)" stroke-width="3" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Palm base -->
  <path d="M60 190 Q50 170 55 150 L55 130 Q60 100 100 95 Q140 100 145 130 L145 150 Q150 170 140 190" 
        stroke="url(#fistGlow)" stroke-width="3" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Knuckles - curved top -->
  <path d="M55 130 Q55 110 70 95 Q85 80 100 80 Q115 80 130 95 Q145 110 145 130" 
        stroke="url(#fistGlow)" stroke-width="3" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Finger segments -->
  <!-- Index finger -->
  <path d="M65 130 L65 95 Q65 75 75 65 Q85 55 85 45" 
        stroke="url(#fistGlow)" stroke-width="2.5" fill="none" filter="url(#neonGlow)"/>
  <path d="M85 45 Q85 35 80 30" 
        stroke="url(#fistGlow)" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Middle finger -->
  <path d="M85 125 L85 85 Q85 60 95 50 Q100 40 100 30" 
        stroke="url(#fistGlow)" stroke-width="2.5" fill="none" filter="url(#neonGlow)"/>
  <path d="M100 30 Q100 20 95 15" 
        stroke="url(#fistGlow)" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Ring finger -->
  <path d="M105 125 L105 85 Q105 65 115 55 Q120 45 120 35" 
        stroke="url(#fistGlow)" stroke-width="2.5" fill="none" filter="url(#neonGlow)"/>
  <path d="M120 35 Q120 25 115 20" 
        stroke="url(#fistGlow)" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Pinky finger -->
  <path d="M125 130 L125 100 Q125 85 130 75 Q135 65 135 55" 
        stroke="url(#fistGlow)" stroke-width="2.5" fill="none" filter="url(#neonGlow)"/>
  <path d="M135 55 Q135 45 130 40" 
        stroke="url(#fistGlow)" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Thumb wrapped around -->
  <path d="M55 150 Q40 140 35 120 Q35 100 50 95 Q65 90 75 100 Q80 110 75 120" 
        stroke="url(#fistGlow)" stroke-width="3" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Knuckle details -->
  <circle cx="70" cy="95" r="4" stroke="url(#fistGlow)" stroke-width="1.5" fill="none" filter="url(#neonGlow)"/>
  <circle cx="90" cy="88" r="4" stroke="url(#fistGlow)" stroke-width="1.5" fill="none" filter="url(#neonGlow)"/>
  <circle cx="110" cy="88" r="4" stroke="url(#fistGlow)" stroke-width="1.5" fill="none" filter="url(#neonGlow)"/>
  <circle cx="130" cy="95" r="4" stroke="url(#fistGlow)" stroke-width="1.5" fill="none" filter="url(#neonGlow)"/>
</svg>
