{% extends "layout.html" %}

{% block title %}Join The Resistance{% endblock %}

{% block extra_css %}
<style>
    :root {
        --neon-cyan: #00ffff;
        --neon-magenta: #ff00ff;
        --neon-pink: #ff0080;
        --neon-purple: #8000ff;
        --dark-bg: #0a0a0f;
        --darker-bg: #050508;
    }
    
    body {
        background: var(--dark-bg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        overflow: hidden;
    }
    
    .landing-container {
        text-align: center;
        padding: 40px;
        max-width: 600px;
    }
    
    .main-title {
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        font-size: 5rem;
        font-weight: 900;
        letter-spacing: 10px;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta), var(--neon-pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 60px rgba(0, 255, 255, 0.5);
        margin-bottom: 60px;
        animation: titlePulse 3s ease-in-out infinite;
    }
    
    @keyframes titlePulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.2); }
    }
    
    .auth-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 50px;
    }
    
    .auth-btn {
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        font-size: 1.3rem;
        letter-spacing: 3px;
        padding: 15px 40px;
        border: 2px solid;
        background: transparent;
        cursor: pointer;
        text-decoration: none;
        text-transform: uppercase;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .auth-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        transition: left 0.5s ease;
    }
    
    .auth-btn:hover::before {
        left: 100%;
    }
    
    .btn-login {
        border-color: var(--neon-cyan);
        color: var(--neon-cyan);
    }
    
    .btn-login:hover {
        background: rgba(0, 255, 255, 0.1);
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.4),
                    inset 0 0 20px rgba(0, 255, 255, 0.1);
        transform: translateY(-3px);
    }
    
    .btn-register {
        border-color: var(--neon-magenta);
        color: var(--neon-magenta);
    }
    
    .btn-register:hover {
        background: rgba(255, 0, 255, 0.1);
        box-shadow: 0 0 30px rgba(255, 0, 255, 0.4),
                    inset 0 0 20px rgba(255, 0, 255, 0.1);
        transform: translateY(-3px);
    }
    
    .cyber-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        z-index: -1;
    }
    
    .scan-line {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        opacity: 0.3;
        animation: scanLine 8s linear infinite;
        pointer-events: none;
        z-index: 100;
    }
    
    @keyframes scanLine {
        0% { top: -10px; }
        100% { top: 100vh; }
    }
    
    @media (max-width: 600px) {
        .main-title {
            font-size: 2.5rem;
            letter-spacing: 4px;
        }
        
        .fist-container {
            width: 180px;
            height: 250px;
        }
        
        .auth-buttons {
            flex-direction: column;
            gap: 15px;
        }
        
        .auth-btn {
            width: 100%;
            padding: 12px 30px;
        }
    }
    
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="cyber-grid"></div>
<div class="scan-line"></div>

<div class="landing-container">
    <h1 class="main-title">JOIN THE RESISTANCE</h1>
    
    <div class="auth-buttons">
        <a href="/login" class="auth-btn btn-login">Login</a>
        <a href="/register" class="auth-btn btn-register">Register</a>
    </div>
</div>
{% endblock %}
