{% extends "layout.html" %}

{% block title %}Join The Resistance{% endblock %}

{% block extra_css %}
<style>
    body {
        background: var(--bg-void);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        overflow: hidden;
    }
    
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: 
            radial-gradient(ellipse 100% 80% at 50% 0%, rgba(0, 240, 255, 0.06) 0%, transparent 50%),
            radial-gradient(ellipse 80% 60% at 20% 100%, rgba(255, 0, 255, 0.05) 0%, transparent 50%),
            radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
    }
    
    .cyber-grid {
        position: fixed;
        inset: 0;
        background-image: 
            linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
        z-index: 0;
    }
    
    .scan-line {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        opacity: 0.4;
        animation: scanLine 10s linear infinite;
        pointer-events: none;
        z-index: 100;
    }
    
    @keyframes scanLine {
        0% { top: -10px; }
        100% { top: 100vh; }
    }
    
    .landing-container {
        text-align: center;
        padding: 40px;
        max-width: 700px;
        position: relative;
        z-index: 1;
    }
    
    .logo-mark {
        width: 80px;
        height: 80px;
        margin: 0 auto 30px;
        border: 2px solid var(--neon-cyan);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: logo-pulse 3s ease-in-out infinite;
        position: relative;
    }
    
    .logo-mark::before {
        content: '';
        position: absolute;
        inset: -8px;
        border: 1px solid rgba(0, 240, 255, 0.2);
        border-radius: 50%;
    }
    
    .logo-mark svg {
        width: 40px;
        height: 40px;
        stroke: var(--neon-cyan);
    }
    
    @keyframes logo-pulse {
        0%, 100% { 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), 0 0 40px rgba(0, 240, 255, 0.1);
        }
        50% { 
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5), 0 0 60px rgba(0, 240, 255, 0.2);
        }
    }
    
    .main-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 8px;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta), var(--neon-violet));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 16px;
        line-height: 1.1;
    }
    
    .subtitle {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.125rem;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 50px;
    }
    
    .fist-image {
        width: 260px;
        height: auto;
        margin: 0 auto 50px;
        display: block;
        filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.3)) brightness(1.1);
        animation: fist-float 5s ease-in-out infinite;
    }
    
    @keyframes fist-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
    }
    
    .auth-buttons {
        display: flex;
        gap: 24px;
        justify-content: center;
    }
    
    .auth-btn {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.9375rem;
        font-weight: 600;
        letter-spacing: 3px;
        padding: 18px 48px;
        border: 2px solid;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        text-decoration: none;
        text-transform: uppercase;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .auth-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        transform: translateX(-100%);
        transition: transform 0.5s ease;
    }
    
    .auth-btn:hover::before {
        transform: translateX(100%);
    }
    
    .btn-login {
        border-color: var(--neon-cyan);
        color: var(--neon-cyan);
    }
    
    .btn-login:hover {
        background: rgba(0, 240, 255, 0.1);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), 0 0 60px rgba(0, 240, 255, 0.2);
        transform: translateY(-3px);
        text-shadow: 0 0 10px var(--neon-cyan);
    }
    
    .btn-register {
        border-color: var(--neon-magenta);
        color: var(--neon-magenta);
    }
    
    .btn-register:hover {
        background: rgba(255, 0, 255, 0.1);
        box-shadow: 0 0 30px rgba(255, 0, 255, 0.4), 0 0 60px rgba(255, 0, 255, 0.2);
        transform: translateY(-3px);
        text-shadow: 0 0 10px var(--neon-magenta);
    }
    
    .footer-text {
        margin-top: 60px;
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    
    @media (max-width: 600px) {
        .main-title {
            font-size: 2rem;
            letter-spacing: 4px;
        }
        
        .subtitle {
            font-size: 0.875rem;
        }
        
        .fist-image {
            width: 180px;
        }
        
        .auth-buttons {
            flex-direction: column;
            gap: 16px;
        }
        
        .auth-btn {
            width: 100%;
            padding: 16px 32px;
        }
    }
    
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="cyber-grid"></div>
<div class="scan-line"></div>

<div class="landing-container">
    <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
    </div>
    
    <h1 class="main-title">Join The Resistance</h1>
    <p class="subtitle">Algorithmic Trading Platform</p>
    
    <img src="{{ url_for('static', filename='resistance-fist.jpg') }}" alt="Resistance" class="fist-image" onerror="this.style.display='none'">
    
    <div class="auth-buttons">
        <a href="/login" class="auth-btn btn-login">Login</a>
        <a href="/register" class="auth-btn btn-register">Register</a>
    </div>
    
    <p class="footer-text">Powered by Alpaca Markets</p>
</div>
{% endblock %}
