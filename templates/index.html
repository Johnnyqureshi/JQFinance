{% extends "layout.html" %}

{% block title %}RESISTANCE - Algorithmic Trading Platform{% endblock %}

{% block extra_css %}
<style>
    body {
        background: var(--bg-void);
        min-height: 100vh;
        margin: 0;
    }

    .landing-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: 1;
        padding: 40px 20px;
    }

    .scan-line {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent 10%, rgba(0, 240, 255, 0.4) 50%, transparent 90%);
        animation: scanLine 8s linear infinite;
        pointer-events: none;
        z-index: 100;
    }

    @keyframes scanLine {
        0% { top: -2px; }
        100% { top: 100vh; }
    }

    .landing-card {
        text-align: center;
        max-width: 560px;
        width: 100%;
        padding: 60px 48px;
        background: rgba(10, 10, 20, 0.7);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(0, 240, 255, 0.12);
        border-radius: 20px;
        position: relative;
        animation: fade-in 0.8s ease-out;
    }

    .landing-card::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 21px;
        padding: 1px;
        background: linear-gradient(160deg, rgba(0, 240, 255, 0.3), rgba(255, 0, 255, 0.15), rgba(139, 92, 246, 0.1), transparent 60%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    .logo-mark {
        width: 80px;
        height: 80px;
        margin: 0 auto 32px;
        border: 1.5px solid rgba(0, 240, 255, 0.5);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: logo-breathe 4s ease-in-out infinite;
        position: relative;
    }

    .logo-mark::before {
        content: '';
        position: absolute;
        inset: -10px;
        border: 1px solid rgba(0, 240, 255, 0.12);
        border-radius: 50%;
    }

    .logo-mark::after {
        content: '';
        position: absolute;
        inset: -20px;
        border: 1px solid rgba(0, 240, 255, 0.06);
        border-radius: 50%;
    }

    .logo-mark svg {
        width: 36px;
        height: 36px;
        stroke: var(--neon-cyan);
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
    }

    @keyframes logo-breathe {
        0%, 100% {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), 0 0 40px rgba(0, 240, 255, 0.05);
        }
        50% {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.35), 0 0 60px rgba(0, 240, 255, 0.1);
        }
    }

    .landing-card h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 2.75rem;
        font-weight: 900;
        letter-spacing: 6px;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--neon-cyan) 0%, #60a0ff 40%, var(--neon-magenta) 70%, var(--neon-violet) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0;
        line-height: 1.15;
    }

    .landing-card h1::after {
        display: none;
    }

    .divider {
        width: 80px;
        height: 1px;
        margin: 24px auto;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-magenta), transparent);
    }

    .tagline {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.0625rem;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 0;
    }

    .feature-row {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin: 40px 0 48px;
    }

    .feature-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .feature-item svg {
        width: 20px;
        height: 20px;
        stroke: var(--neon-cyan);
        opacity: 0.6;
    }

    .feature-item span {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.6875rem;
        color: var(--text-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .auth-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
    }

    .auth-btn {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 3px;
        padding: 16px 44px;
        border: 1.5px solid;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        text-decoration: none;
        text-transform: uppercase;
        transition: all 0.35s ease;
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    .auth-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.35s ease;
    }

    .auth-btn:hover::before {
        opacity: 1;
    }

    .btn-login {
        border-color: var(--neon-cyan);
        color: var(--neon-cyan);
    }

    .btn-login::before {
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.03));
    }

    .btn-login:hover {
        box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), 0 0 50px rgba(0, 240, 255, 0.1);
        transform: translateY(-2px);
        text-shadow: 0 0 12px var(--neon-cyan);
    }

    .btn-register {
        border-color: var(--neon-magenta);
        color: var(--neon-magenta);
    }

    .btn-register::before {
        background: linear-gradient(135deg, rgba(255, 0, 255, 0.1), rgba(255, 0, 255, 0.03));
    }

    .btn-register:hover {
        box-shadow: 0 0 25px rgba(255, 0, 255, 0.3), 0 0 50px rgba(255, 0, 255, 0.1);
        transform: translateY(-2px);
        text-shadow: 0 0 12px var(--neon-magenta);
    }

    .auth-btn:active {
        transform: translateY(0);
    }

    .footer-badge {
        margin-top: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.6875rem;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .footer-badge .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--neon-green);
        box-shadow: 0 0 6px var(--neon-green);
        animation: status-pulse 2s ease-in-out infinite;
    }

    @media (max-width: 600px) {
        .landing-card {
            padding: 40px 24px;
        }

        .landing-card h1 {
            font-size: 1.75rem;
            letter-spacing: 3px;
        }

        .tagline {
            font-size: 0.875rem;
            letter-spacing: 2px;
        }

        .feature-row {
            gap: 24px;
        }

        .auth-buttons {
            flex-direction: column;
            gap: 14px;
        }

        .auth-btn {
            width: 100%;
            justify-content: center;
            padding: 14px 32px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="scan-line"></div>

<div class="landing-wrapper">
    <div class="landing-card">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
        </div>

        <h1>Resistance</h1>

        <div class="divider"></div>

        <p class="tagline">Algorithmic Trading Platform</p>

        <div class="feature-row">
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                <span>ORB</span>
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M2 20h.01"/>
                    <path d="M7 20v-4"/>
                    <path d="M12 20v-8"/>
                    <path d="M17 20V8"/>
                    <path d="M22 4v16"/>
                </svg>
                <span>SMA</span>
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Paper</span>
            </div>
        </div>

        <div class="auth-buttons">
            <a href="/login" class="auth-btn btn-login">Login</a>
            <a href="/register" class="auth-btn btn-register">Register</a>
        </div>

        <div class="footer-badge">
            <span class="dot"></span>
            <span>Powered by Alpaca</span>
        </div>
    </div>
</div>
{% endblock %}
