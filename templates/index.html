{% extends "layout.html" %}

{% block title %}ORB Auto Trader{% endblock %}

{% block content %}
<div class="container">
    <h1>ORB Auto Trader</h1>
    <p>Select an asset and run the strategy.</p>

    <label>Choose Asset:</label>
    <select id="symbol">
        {% for a in assets %}
        <option value="{{ a }}">{{ a }}</option>
        {% endfor %}
    </select>

    <label>Take Profit:</label>
    <select id="profit">
        <option value="0.05" selected>5%</option>
        <option value="0.10">10%</option>
        <option value="0.15">15%</option>
        <option value="0.20">20%</option>
        <option value="0.25">25%</option>
    </select>

    <button onclick="runORB()">Run ORB Strategy</button>

    <div id="result" class="result"></div>

    <p style="margin-top: 20px; text-align: center;">
        <a href="/login">Login</a> | <a href="/register">Register</a>
    </p>

    <button class="theme-btn" onclick="toggleTheme()">Toggle Dark/Light Mode</button>
</div>
{% endblock %}
