<!DOCTYPE html>
<html>
<head>
    <title>Register - ORB Auto Trader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>ORB Auto Trader</h1>
    <p>Create your account</p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="result" style="color: #f44;">
        {% for message in messages %}
        {{ message }}
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST">
        <label>Username:</label>
        <input type="text" name="username" required>
        
        <label>Password:</label>
        <input type="password" name="password" required>
        
        <button type="submit">Register</button>
    </form>

    <p style="margin-top: 20px; text-align: center;">
        Already have an account? <a href="/login" style="color: #00c56e;">Login</a>
    </p>

    <button class="theme-btn" onclick="toggleTheme()">Toggle Dark/Light Mode</button>
</div>

<script src="/static/script.js"></script>
</body>
</html>
